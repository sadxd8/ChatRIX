
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaadChat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:#fff}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:11px;background:#3878f6;color:white}
input{padding:12px;border:1px solid #344158;border-radius:9px;background:#1d293b;color:white;width:100%}
.auth{max-width:390px;margin:70px auto;padding:24px;background:#1d293b;border-radius:18px}
.auth h1{text-align:center;color:#65a0ff}
.auth input{margin:7px 0}
.auth button{width:100%;margin-top:9px}
#app{display:none;max-width:1000px;margin:auto;height:100dvh;padding:12px}
.layout{display:grid;grid-template-columns:270px 1fr;height:100%;background:#1d293b;border-radius:16px;overflow:hidden}
.sidebar{padding:14px;border-right:1px solid #344158;overflow:auto}
.sidebar h2{color:#65a0ff}
.person{display:block;width:100%;text-align:left;margin:6px 0;background:#28364b;overflow-wrap:anywhere}
.person.active{background:#3878f6}
.chat{display:flex;flex-direction:column;min-width:0}
.top{padding:14px;border-bottom:1px solid #344158}
#messages{flex:1;overflow-y:auto;padding:14px}
.msg{max-width:85%;background:#2b3a50;padding:10px 12px;border-radius:12px;margin:9px 0;overflow-wrap:anywhere}
.msg.mine{margin-left:auto;background:#2563eb}
.msg small{display:block;color:#c4d2e8;margin-bottom:5px}
.msg img{display:block;max-width:100%;max-height:300px;border-radius:8px;margin-top:7px}
.composer{display:flex;gap:7px;padding:10px;border-top:1px solid #344158;align-items:center}
.composer input{min-width:0}
#status{font-size:12px;color:#a9bad2}
.hidden{display:none!important}
@media(max-width:600px){
 #app{padding:0}
 .layout{grid-template-columns:105px 1fr;border-radius:0}
 .sidebar{padding:7px}
 .sidebar h2{font-size:16px}
 .person{font-size:12px;padding:8px}
 .top{padding:10px;font-size:14px}
 .composer{flex-wrap:wrap}
 .composer input[type=text]{width:100%;flex:1 1 100%}
 .msg{max-width:95%}
}
</style>
</head>
<body>

<section class="auth" id="auth">
<h1>💬 SaadChat</h1>
<p>Connect with your friends</p>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<input id="displayName" placeholder="Your name (for signup)" maxlength="40">
<button id="signup">Create Account</button>
<button id="login">Login</button>
<p id="authStatus"></p>
</section>

<section id="app">
<div class="layout">
<aside class="sidebar">
<h2>SaadChat</h2>
<button id="groupBtn" style="width:100%">🌐 Group Chat</button>
<p>People</p>
<div id="users"></div>
<hr>
<button id="logout" style="background:#b93848;width:100%">Logout</button>
<p id="status"></p>
</aside>

<main class="chat">
<header class="top">
<strong id="chatTitle">Group Chat</strong>
<div id="chatSubtitle">Messages update live</div>
</header>
<div id="messages"></div>
<form class="composer" id="composer">
<input id="message" type="text" placeholder="Write a message..." maxlength="3000" autocomplete="off">
<label title="Send image" style="cursor:pointer">🖼️
<input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
</label>
<button id="send" type="submit">Send</button>
</form>
</main>
</div>
</section>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 onAuthStateChanged,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
 getFirestore,doc,setDoc,getDoc,collection,addDoc,
 onSnapshot,query,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* Replace this object with your Firebase config */
const firebaseConfig = {
 apiKey: "AIzaSyA1_hSc1EzR8LZzMTpcvnRvLsJyfeXzvbc",
  authDomain: "chatrix-b1173.firebaseapp.com",
  projectId: "chatrix-b1173",
  storageBucket: "chatrix-b1173.firebasestorage.app",
  messagingSenderId: "550224627068",
  appId: "1:550224627068:web:c8a306172861e9054050f9",
  measurementId: "G-BP4HJ81YTR"
};

/* Get your key from https://api.imgbb.com/ */
const IMGBB_API_KEY = "e87556510506a1e7a939e93b24e1786b";

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

const $ = id => document.getElementById(id);
let currentUser = null;
let activeChat = "global";
let stopMessages = null;
let stopUsers = null;
let knownUsers = {};

function showStatus(message){
 $("status").textContent = message;
}
function reportError(error, target="authStatus"){
 console.error(error);
 $(target).textContent =
 error.code ? error.code + ": " + error.message : error.message;
}

function privateChatId(uid1,uid2){
 return [uid1,uid2].sort().join("_");
}

$("signup").onclick = async () => {
 const email = $("email").value.trim();
 const password = $("password").value;
 const name = $("displayName").value.trim();
 if(!name){$("authStatus").textContent="Enter your name first.";return;}
 if(name.length>40){$("authStatus").textContent="Name is too long.";return;}
 try{
  const result = await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(result.user,{displayName:name});
  await setDoc(doc(db,"users",result.user.uid),{
   uid:result.user.uid,name,email,
   createdAt:serverTimestamp()
  });
 }catch(e){reportError(e);}
};

$("login").onclick = async () => {
 try{
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
 }catch(e){reportError(e);}
};

$("logout").onclick = () => signOut(auth);
$("groupBtn").onclick = () => openChat("global","Group Chat");

onAuthStateChanged(auth,async user=>{
 if(stopMessages)stopMessages();
 if(stopUsers)stopUsers();
 currentUser=user;
 $("auth").style.display=user?"none":"block";
 $("app").style.display=user?"block":"none";
 if(!user)return;

 try{
  await setDoc(doc(db,"users",user.uid),{
   uid:user.uid,name:user.displayName||"User",
   email:user.email
  },{merge:true});

  stopUsers=onSnapshot(collection(db,"users"),snapshot=>{
   knownUsers={};
   $("users").innerHTML="";
   snapshot.forEach(item=>{
    const person=item.data();
    knownUsers[item.id]=person;
    if(item.id===user.uid)return;

    const btn=document.createElement("button");
    btn.className="person"+(activeChat===privateChatId(user.uid,item.id)?" active":"");
    btn.textContent="👤 "+(person.name||person.email||"User");
    btn.onclick=async()=>{
     const id=privateChatId(user.uid,item.id);
     try{
      await setDoc(doc(db,"chats",id),{
       members:[user.uid,item.id].sort(),
       updatedAt:serverTimestamp()
      },{merge:true});
      openChat(id,person.name||"Private Chat");
     }catch(e){showStatus(e.message);}
    };
    $("users").appendChild(btn);
   });
  },e=>showStatus(e.message));

  openChat("global","Group Chat");
 }catch(e){showStatus(e.message);}
});

function openChat(chatId,title){
 activeChat=chatId;
 $("chatTitle").textContent=title;
 $("chatSubtitle").textContent=chatId==="global"
  ?"Public group chat":"Private conversation";
 $("messages").innerHTML="";
 if(stopMessages)stopMessages();

 const q=query(
  collection(db,"chats",chatId,"messages"),
  orderBy("createdAt","asc")
 );

 stopMessages=onSnapshot(q,snapshot=>{
  $("messages").innerHTML="";
  snapshot.forEach(item=>{
   const m=item.data();
   const bubble=document.createElement("div");
   bubble.className="msg"+(m.senderId===currentUser.uid?" mine":"");

   const name=document.createElement("small");
   name.textContent=m.senderId===currentUser.uid
    ?"You":(knownUsers[m.senderId]?.name||"User");
   bubble.appendChild(name);

   if(m.text){
    const text=document.createElement("div");
    text.textContent=m.text;
    bubble.appendChild(text);
   }
   if(m.imageUrl){
    const img=document.createElement("img");
    img.src=m.imageUrl;
    img.alt="Shared image";
    img.loading="lazy";
    img.referrerPolicy="no-referrer";
    bubble.appendChild(img);
   }
   $("messages").appendChild(bubble);
  });
  $("messages").scrollTop=$("messages").scrollHeight;
 },e=>showStatus(e.message));
}

$("composer").onsubmit=async event=>{
 event.preventDefault();
 const text=$("message").value.trim();
 if(!text||!currentUser)return;

 $("send").disabled=true;
 try{
  await addDoc(collection(db,"chats",activeChat,"messages"),{
   senderId:currentUser.uid,
   text,
   createdAt:serverTimestamp()
  });
  $("message").value="";
  showStatus("Message sent");
 }catch(e){showStatus(e.message);}
 finally{$("send").disabled=false;}
};

$("image").onchange=async()=>{
 const file=$("image").files[0];
 if(!file||!currentUser)return;
 if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)){
  showStatus("Choose a JPG, PNG, WEBP or GIF image.");return;
 }
 if(file.size>5*1024*1024){
  showStatus("Image must be 5 MB or smaller.");return;
 }
 if(IMGBB_API_KEY==="e87556510506a1e7a939e93b24e1786b"){
  showStatus("Add your ImgBB API key first.");return;
 }

 $("image").disabled=true;
 showStatus("Uploading image...");
 try{
  const form=new FormData();
  form.append("image",file);
  const response=await fetch(
   "https://api.imgbb.com/1/upload?key="+encodeURIComponent(IMGBB_API_KEY),
   {method:"POST",body:form}
  );
  const result=await response.json();
  if(!response.ok||!result.success)throw new Error("Image upload failed.");

  await addDoc(collection(db,"chats",activeChat,"messages"),{
   senderId:currentUser.uid,
   imageUrl:result.data.url,
   createdAt:serverTimestamp()
  });
  showStatus("Image sent!");
 }catch(e){showStatus(e.message);}
 finally{
  $("image").disabled=false;
  $("image").value="";
 }
};
</script>
</body>
</html>
