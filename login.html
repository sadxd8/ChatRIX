<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · ChatRIX</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-wrap"><section class="auth-card">
<div class="brand-row"><div class="brand-mark">C</div><div class="brand">Chat<span>RIX</span></div></div>
<h1>Welcome back</h1><p class="intro">Sign in and pick up where your conversations left off.</p>
<form id="loginForm">
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Your password"></div>
<button class="btn" id="loginBtn" type="submit">Sign in to ChatRIX</button><div class="notice" id="notice" role="status"></div>
</form><div class="auth-foot">New to ChatRIX? <a href="signup.html">Create an account</a></div>
</section></main><script type="module" src="auth.js"></script></body></html>
